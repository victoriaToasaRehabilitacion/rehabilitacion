<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B2A5B">
  <meta name="description" content="Movify Senior: Plataforma de rehabilitación y bienestar físico adaptada para adultos mayores y profesionales de la salud.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/app_icon_simple_cyan.png">
  
  <!-- PRECONECTAR YOUTUBE PARA CARGA INSTANTÁNEA SIN DEMORAS -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  
  <!-- TIPOGRAFÍA OFICIAL DEL BRANDING: Montserrat (Títulos/Botones) e Inter (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <title>Movify Senior · Tu salud en movimiento</title>
  
  <style>
    /* PALETA DE COLOR OFICIAL EXTRAÍDA DEL KIT DE MARCA */
    :root {
      --azul-profundo: #1B2A5B;
      --verde-vitalidad: #008894;
      --verde-vitalidad-light: #e0f6f7;
      --azul-principal: #3882F6;
      --morado: #8B5CF6;
      --morado-soft: #ede7fb;
      --rosa: #F9A8D4;
      --rosa-palido: #FCE7F3;
      --azul-grisaceo: #64748B;
      
      --bg-light: #F8FAFC;
      --surface: #FFFFFF;
      --dark: #1B2A5B;
      --ink: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;

      --shadow-sm: 0 4px 12px rgba(27, 42, 91, 0.06);
      --shadow-md: 0 10px 25px rgba(27, 42, 91, 0.1);
      --shadow-lg: 0 20px 45px rgba(27, 42, 91, 0.16);

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;

      --font-title: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--ink);
      background: #F1F5F9;
      font-size: 16px;
      line-height: 1.5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:active {
      transform: scale(0.97);
    }

    .app-container {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 45%, #EFF6FF 100%);
      position: relative;
      overflow-x: hidden;
    }

    @media(min-width: 1000px) {
      .app-container {
        max-width: 1240px;
        box-shadow: 0 0 70px rgba(27, 42, 91, 0.14);
      }
    }

    .screen {
      min-height: 100vh;
      padding-bottom: 96px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TOPBAR CON IDENTIDAD VISUAL DEL KIT */
    .topbar {
      height: 78px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-brand img.logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .iconbtn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--azul-profundo);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
    }

    .iconbtn:hover {
      background: var(--verde-vitalidad-light);
      border-color: var(--verde-vitalidad);
    }

    .iconbtn.sos-btn {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #DC2626;
      font-weight: 800;
      font-size: 15px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .iconbtn.about-btn {
      width: auto;
      padding: 0 12px;
      background: var(--verde-vitalidad-light);
      border-color: rgba(0, 136, 148, 0.35);
      color: var(--verde-vitalidad);
      font-weight: 800;
      font-size: 11px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .about-icon {
      width: 22px;
      height: 22px;
      display: block;
      flex-shrink: 0;
    }

    @media(max-width: 400px) {
      .iconbtn.about-btn {
        width: 48px;
        padding: 0;
      }
      .about-label {
        display: none;
      }
    }

    .content {
      padding: 22px 20px;
      max-width: 960px;
      margin: auto;
    }

    /* HERO CARD PACIENTE CON ILUSTRACIÓN */
    .hero {
      background: linear-gradient(135deg, var(--azul-profundo) 0%, #293B7A 60%, var(--verde-vitalidad) 100%);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 65%;
    }

    .hero-illustration {
      position: relative;
      z-index: 2;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-illustration img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }

    .eyebrow {
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--rosa-palido);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0 6px;
      line-height: 1.15;
    }

    .streak-badge {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* BOTONES ESTILO KIT DE MARCA */
    .btn {
      min-height: 52px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--morado) 0%, #7C3AED 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
      transform: translateY(-2px);
    }

    .btn-vitalidad {
      background: linear-gradient(135deg, var(--verde-vitalidad) 0%, #00707B 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(0, 136, 148, 0.35);
    }

    .btn-vitalidad:hover {
      transform: translateY(-2px);
    }

    .btn-soft {
      background: #FFFFFF;
      color: var(--azul-profundo);
      border: 1.5px solid var(--border);
    }

    .btn-soft:hover {
      background: var(--bg-light);
      border-color: var(--azul-principal);
    }

    .btn-danger {
      background: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    .btn-sm {
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 28px 0 14px;
    }

    .section-title h2 {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 800;
      color: var(--azul-profundo);
    }

    /* TARJETAS DE CATEGORÍAS CON ILUSTRACIONES DE ABUELITOS */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .cat-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--verde-vitalidad);
    }

    .cat-card-info b {
      font-family: var(--font-title);
      font-size: 17px;
      font-weight: 800;
      color: var(--azul-profundo);
      display: block;
      margin-bottom: 4px;
    }

    .cat-card-info span {
      font-size: 13px;
      color: var(--muted);
    }

    .cat-card-art {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-card-art img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* CARD GENÉRICA */
    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 99px;
      background: var(--verde-vitalidad-light);
      color: var(--verde-vitalidad);
      font-weight: 700;
      font-size: 12px;
      border: 1px solid rgba(0, 136, 148, 0.2);
    }

    .chip-purple {
      background: var(--morado-soft);
      color: var(--morado);
      border-color: rgba(139, 92, 246, 0.2);
    }

    /* LISTA DE EJERCICIOS */
    .exercise-list {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .exercise-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .exercise-card-art {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--verde-vitalidad-light);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .exercise-card-art img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .exercise-info h3 {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 700;
      color: var(--azul-profundo);
      margin-bottom: 2px;
    }

    .exercise-info p {
      color: var(--muted);
      font-size: 13px;
    }

    /* BARRA DE NAVEGACIÓN CON ICONOS OFICIALES DEL KIT */
    .bottomnav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1240px;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
      z-index: 50;
    }

    .navitem {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--azul-grisaceo);
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      padding: 4px;
      border-radius: 12px;
    }

    .navitem.active {
      color: var(--verde-vitalidad);
    }

    .navitem img.nav-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin-bottom: 2px;
      transition: transform 0.2s;
    }

    .navitem.active img.nav-icon {
      transform: scale(1.15);
      filter: drop-shadow(0 2px 5px rgba(0, 136, 148, 0.3));
    }

    /* PANTALLA LOGIN CON IMAGEN DE MARCA */
    .login-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .login-box {
      width: min(480px, 100%);
      background: #FFFFFF;
      border-radius: 32px;
      padding: 34px 26px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
    }

    .login-logo {
      width: 120px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #F1F5F9;
      padding: 5px;
      border-radius: 18px;
      margin: 20px 0 14px;
      gap: 4px;
    }

    .role-tab-btn {
      padding: 10px 4px;
      border-radius: 14px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 13px;
      color: var(--azul-grisaceo);
    }

    .role-tab-btn.active {
      background: var(--azul-profundo);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .demo-callout {
      background: var(--verde-vitalidad-light);
      color: var(--azul-profundo);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 18px;
      border: 1px dashed rgba(0, 136, 148, 0.35);
      text-align: left;
    }

    /* BOTÓN Y MODAL DE RUMBATERAPIA (ZUMBA SENIOR) */
    .rumba-card {
      position: relative;
      background: linear-gradient(135deg, #FF6565 0%, #FF8E53 50%, #F59E0B 100%);
      color: #FFFFFF;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(255, 101, 101, 0.28);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
    .rumba-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 101, 101, 0.4);
    }
    .rumba-card:active {
      transform: scale(0.98);
    }
    .rumba-card::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -20%;
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }
    .rumba-card-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      animation: rumbaBounce 2.4s infinite ease-in-out;
    }
    @keyframes rumbaBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(4deg); }
    }
    .rumba-card-info {
      flex: 1;
      min-width: 0;
    }
    .rumba-card-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.18);
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 4px;
    }
    .rumba-card-title {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
      margin: 0 0 3px 0;
      color: #FFFFFF;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .rumba-card-subtitle {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.94;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .rumba-card-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .rumba-play-pill {
      background: #FFFFFF;
      color: #DE4371;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .rumba-play-pill span.icon {
      font-size: 13px;
    }

    /* MODAL TEATRO DE RUMBATERAPIA */
    .rumba-modal-content {
      position: relative;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 20px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.35);
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .rumba-player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      margin: 14px 0;
    }
    .rumba-player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .rumba-tips-box {
      background: var(--verde-vitalidad-light);
      border: 1px solid rgba(0, 136, 148, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--azul-profundo);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      text-align: left;
    }
    .rumba-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    .rumba-opt-btn {
      flex: 1;
      min-width: 140px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--azul-profundo);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .rumba-opt-btn.active {
      border-color: #FF6565;
      background: #FFF5F5;
      color: #DE4371;
    }

    /* =============================================================
       MODO ENFOQUE VERTICAL (ZOOM A LOS 4 SEGUNDOS - RUMBATERAPIA)
       ============================================================= */
    .rumba-zoomed-vertical {
      background: rgba(0, 0, 0, 0.96) !important;
      padding: 0 !important;
    }
    .rumba-zoomed-vertical .rumba-modal-content {
      height: 100vh !important;
      height: 100dvh !important;
      max-height: 100vh !important;
      width: 100vw !important;
      max-width: min(540px, 100vw) !important;
      margin: 0 auto !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background: #000000 !important;
      box-shadow: 0 0 60px rgba(0,0,0,0.9) !important;
      border: none !important;
      display: flex !important;
      flex-direction: column !important;
      position: relative !important;
      overflow: hidden !important;
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .rumba-zoomed-vertical .rumba-modal-header-standard,
    .rumba-zoomed-vertical #rumba-selector-bar,
    .rumba-zoomed-vertical .rumba-tips-box,
    .rumba-zoomed-vertical .rumba-footer-btn-standard {
      display: none !important;
    }
    .rumba-zoomed-vertical .rumba-player-wrapper {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      border-radius: 0 !important;
      aspect-ratio: auto !important;
      background: #000000 !important;
      overflow: hidden !important;

  /* -------------------------------------------------------------

     ------------------------------------------------------------- */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBubbleSound() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const now = ctx.currentTime;
      const baseFreq = 420 + Math.random() * 90;
      osc.type = "sine";
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.08);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.09);
    } catch (e) {}
  }

  function vibratePhone(pattern = 25) {

  let currentTrackIndex = 0;
  let bgAudio = new Audio();
  bgAudio.volume = 0.42;

  function loadTrack(index) {
    currentTrackIndex = (index + playlist.length) % playlist.length;
    bgAudio.src = playlist[currentTrackIndex].file;
    bgAudio.load();
  }
  loadTrack(0);

  // Reproducción secuencial: al terminar una canción, salta a la siguiente

  let cachedLatinVoice = null;

  function getLatinVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;

    // Filtrar voces en español excluyendo expresamente España (es-ES / Spain)
    const latinVoices = voices.filter(v => {
      const lang = (v.lang || "").toLowerCase().replace("_", "-");
      const name = (v.name || "").toLowerCase();
      const isSpanish = lang.startsWith("es");
      const isSpain = lang === "es-es" || name.includes("spain") || name.includes("españa") || name.includes("castilian") || name.includes("castellano");
      return isSpanish && !isSpain;
    });

    if (latinVoices.length === 0) {
      // Si solo existen voces genéricas 'es', intentar evitar España
      const fallback = voices.find(v => (v.lang || "").toLowerCase().startsWith("es") && !(v.lang || "").toLowerCase().includes("es-es"));
      return fallback || null;
    }

    // 1. Priorizar voces naturales / online (Microsoft Dalia Natural, Salome Natural, etc.)
    const naturalVoice = latinVoices.find(v => {
      const n = v.name.toLowerCase();
      return n.includes("natural") || n.includes("online");
    });
    if (naturalVoice) return naturalVoice;

    // 2. Voces amables y cálidas de acento latino (Sabina, Dalia, Paulina, Salome, Estados Unidos, Raul, Jorge)
    const preferredNames = [
      "sabina", "dalia", "paulina", "salome", "salomé", 
      "paloma", "estados unidos", "raul", "raúl", "jorge", "gonzalo"
    ];
    for (const nameKey of preferredNames) {
      const found = latinVoices.find(v => v.name.toLowerCase().includes(nameKey));
      if (found) return found;
    }

    // 3. Regiones preferidas de habla hispana en América (Ecuador, Latinoamérica, México, Colombia, etc.)
    const preferredLangs = ["es-419", "es-ec", "es-mx", "es-co", "es-us", "es-pe", "es-ar", "es-cl"];
    for (const langKey of preferredLangs) {
      const found = latinVoices.find(v => v.lang.toLowerCase().replace("_", "-").startsWith(langKey));
      if (found) return found;
    }

    return latinVoices[0];
  }

  function initLatinVoice() {
    if ("speechSynthesis" in window) {
      cachedLatinVoice = getLatinVoice();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = function() {
          cachedLatinVoice = getLatinVoice();
        };
      }
    }
  }
  initLatinVoice();

  function speak(t) {
    if (state.voice && "speechSynthesis" in window) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        const voice = cachedLatinVoice || getLatinVoice();
        if (voice) {
          u.voice = voice;
          u.lang = voice.lang || "es-419";
        } else {
          u.lang = (navigator.language && navigator.language.startsWith("es-") && !navigator.language.toLowerCase().includes("es-es")) 
            ? navigator.language 
            : "es-419";
        }
        u.rate = 0.92;
        speechSynthesis.speak(u);
      } catch (e) {}
    }
  }

  function getRandomIndex(total, currentIndex) {
    if (total <= 1) return 0;
    let idx;
    do {

    } while (idx === currentIndex);
    return idx;
  }

    if (dList.length > 0) {
      currentDoctorIndex = getRandomIndex(dList.length, currentDoctorIndex);

            ${currentIntroStep > 0 ? `<button class="btn btn-soft" style="flex:1" onclick="prevIntroStep()">Atrás</button>` : ""}
            <button class="btn btn-vitalidad" style="flex:2" onclick="nextIntroStep()">${step.actionText}</button>
          </div>
        </div>
      </div>
    `;
  }

  function nextIntroStep() {
    if (currentIntroStep < introSteps.length - 1) {
      currentIntroStep++;
      renderIntroStep();
      speak(introSteps[currentIntroStep].title);
    } else {
      document.getElementById("intro-container").innerHTML = "";
      toast("¡Guía completada! Disfruta tu experiencia en Movify Senior.");
    }
  }

  function prevIntroStep() {
    if (currentIntroStep > 0) {
      currentIntroStep--;
      renderIntroStep();
    }
  }

  function logout() {
    state.role = null;
    state.screen = "login";
    stopBackgroundMusic();
    if (DEMO_CONFIG.isTesting) {
      pickRandomProfiles();
    }
    save();
    render();
    toast("Sesión cerrada");
  }

  function go(s) {
    if (s === "login") {
      state.role = null;
      if (DEMO_CONFIG.isTesting) {
        pickRandomProfiles();
      }
    }
    state.screen = s;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* Helper para obtener nombres de médicos asignados al paciente */
  function getPatientDoctors(docIds) {
    if (!docIds || !docIds.length) return [state.doctors[0]];
    return docIds.map(id => state.doctors.find(d => d.id === id)).filter(Boolean);
  }

  /* Helper para mostrar las medallas del perfil como iconos en vez de un número */
  function renderMedals(count) {
    if (!count || count <= 0) {
      return `<div style="font-size:12px;color:var(--muted)">Aún sin medallas</div>`;
    }
    const shown = Math.min(count, 6);
    const icons = "🏅".repeat(shown);
    const extra = count > shown
      ? `<span style="font-size:12px;color:var(--azul-principal);font-weight:700;margin-left:2px">+${count - shown}</span>`
      : "";
    return `<div style="font-size:18px;line-height:1.3;letter-spacing:1px" title="${count} medallas">${icons}${extra}</div>`;
  }

  function app(html) { document.getElementById("app").innerHTML = html; }

  function render() {
    const r = state.role;

    if (!r || s === "login") return app(login());
    if (r === "admin" || s === "admin") return app(adminDashboard());
    if (r === "doctor" || s === "doctor") return app(doctorDashboard());
    if (s === "home") app(home());
    else if (s === "routines") app(routines());
    else if (s === "exercise") app(exerciseScreen());
    else if (s === "alerts") app(alerts());
    else if (s === "profile") app(profile());
    else if (s === "emergency") app(emergency());
    else app(home());

  function routine(cat) {
    state.exercise = { category: cat, index: 0, reps: 0, paused: false };
    state.screen = "exercise";
    save();
    render();
    startBackgroundMusic();
    speak("Comencemos la rutina de " + cat);
  }

  function startRoutine() { routine("Calentamiento"); }

  function startExercise(cat, i) {
    state.exercise = { category: cat, index: i, reps: 0, paused: false };
    state.screen = "exercise";
    save();
    render();
    startBackgroundMusic();
    speak("Comenzamos: " + exercises[cat][i][0]);
  }

  function tickExercise() {
    if (state.exercise.paused) return toast("Ejercicio en pausa");
    const e = exercises[state.exercise.category][state.exercise.index];
    if (state.exercise.reps < e[1]) {
      state.exercise.reps++;
      vibratePhone(40);
      const left = e[1] - state.exercise.reps;
      if (left > 0) speak(`${left} restantes`);
      else speak("Ejercicio completado. ¡Muy bien!");
      save();
      render();
    } else {
      nextExercise();
    }
  }

  function nextExercise() {
    const cat = state.exercise.category;
    const next = state.exercise.index + 1;
    if (next < exercises[cat].length) {
      state.exercise.index = next;
      state.exercise.reps = 0;
      save();
      render();
      speak("Siguiente: " + exercises[cat][next][0]);
    } else {
      state.streak = Math.max(state.streak, 7);
      state.routinesDone++;
      state.medals++;
      stopBackgroundMusic();
      vibratePhone([60, 100, 60, 100, 120]);
      save();
      go("home");
      toast("¡Rutina completada con éxito!");
      speak(`¡Excelente sesión, ${state.user.name}! Has completado tu rutina diaria.`);
    }
  }

  function pauseExercise() {
    state.exercise.paused = !state.exercise.paused;
    if (state.exercise.paused) {
      pauseBackgroundMusic();
    } else {
      resumeBackgroundMusic();
    }
    save();
    render();
  }

  function resetExercise() {
    state.exercise.reps = 0;
    state.exercise.paused = false;
    startBackgroundMusic();
    save();
    render();
  }

    const ind = document.getElementById("rumba-zoom-indicator");
    if (ind) ind.style.display = "none";
    toast("↕️ Enfoque Vertical: Profesor en pantalla completa");
  }

  function toggleRumbaVerticalZoom() {
    const modal = document.getElementById("rumba-modal");
    if (!modal) return;
    isRumbaZoomed = !isRumbaZoomed;
    modal.classList.toggle("rumba-zoomed-vertical", isRumbaZoomed);
    toast(isRumbaZoomed ? "Modo Vertical Activado" : "Vista Completa Activada");
  }

  function openRumbaterapiaModal(index = 0) {
    currentRumbaIndex = index;
    isRumbaZoomed = false;
    const v = rumbaVideos[currentRumbaIndex];

    // Pausar música de fondo de la app para no mezclar audios
    wasMusicPlayingBeforeRumba = bgAudio && !bgAudio.paused;
    if (wasMusicPlayingBeforeRumba) {
      pauseBackgroundMusic();
    }

    // Cancelar cualquier temporizador previo
    if (rumbaZoomTimer) clearTimeout(rumbaZoomTimer);

    // Programar la expansión con zoom vertical exactamente a los 4 segundos
    rumbaZoomTimer = setTimeout(() => {
      activateRumbaVerticalZoom();
    }, 4000);

    const modal = document.createElement("div");
    modal.id = "rumba-modal";
    modal.className = "modal-overlay show rumba-modal-overlay";
    modal.style.zIndex = "99999";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.style.padding = "16px";

    modal.innerHTML = `
      <div class="rumba-modal-content">
        <!-- CABECERA ESTÁNDAR (PRIMEROS 4 SEGUNDOS) -->
        <div class="rumba-modal-header-standard" style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <span class="rumba-card-tag" style="background:#FFE4E6;color:#DE4371">💃 Rumbaterapia Activa</span>
            <h2 style="font-family:var(--font-title);font-size:20px;color:var(--azul-profundo);margin:4px 0 2px" id="rumba-modal-title">${v.title}</h2>
            <small style="color:var(--muted)">Canal: <b>${v.channel}</b> · YouTube</small>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span id="rumba-zoom-indicator" class="rumba-countdown-toast">↕️ Zoom vertical en 4s</span>
            <button class="iconbtn" onclick="closeRumbaterapiaModal()" style="font-size:20px;width:38px;height:38px;border-radius:50%">✕</button>
          </div>
        </div>

        <!-- SELECTOR ESTÁNDAR -->
        <div class="rumba-selector" id="rumba-selector-bar">
          ${rumbaVideos.map((item, idx) => `
            <button type="button" class="rumba-opt-btn ${idx === currentRumbaIndex ? "active" : ""}" onclick="switchRumbaVideo(${idx})">
              ${item.type} · ${item.title.split("(")[0]}
            </button>
          `).join("")}
        </div>

        <!-- CONTENEDOR DEL VIDEO CON ZOOM VERTICAL -->
        <div class="rumba-player-wrapper" id="rumba-player-container">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&start=${v.start || 0}&rel=0&modestbranding=1&playsinline=1" 
            title="${v.title}" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <!-- CONTROLES FLOTANTES EN MODO VERTICAL -->
        <div class="rumba-vertical-overlay">
          <div class="rumba-overlay-top">
            <span class="rumba-badge-vertical">
              <span class="pulse-dot"></span> 💃 Enfoque Vertical (Profesor)
            </span>
            <div style="display:flex;align-items:center;gap:8px">
              <button type="button" class="rumba-btn-toggle-zoom" onclick="toggleRumbaVerticalZoom()" title="Alternar entre Zoom Vertical y Vista Completa">
                ↕️ Ajustar
              </button>
              <button type="button" class="rumba-btn-close-vertical" onclick="closeRumbaterapiaModal()">
                ✕ Salir
              </button>
            </div>
          </div>

          <div class="rumba-overlay-bottom">
            <div style="display:flex;gap:8px;justify-content:center">
              ${rumbaVideos.map((item, idx) => `
                <button type="button" class="rumba-opt-btn ${idx === currentRumbaIndex ? "active" : ""}" style="background:rgba(0,0,0,0.65);color:#fff;border-color:rgba(255,255,255,0.35);padding:6px 14px;font-size:12px" onclick="switchRumbaVideo(${idx})">
                  ${item.type} · ${item.title.split("(")[0]}
                </button>
              `).join("")}
            </div>
            <div style="color:rgba(255,255,255,0.92);font-size:11px;text-align:center">
              💡 Vista vertical completa: laterales recortados para enfocar al profesor en pantalla grande.
            </div>
          </div>
        </div>

        <!-- CONSEJOS ESTÁNDAR -->
        <div class="rumba-tips-box">
          <div style="font-weight:700">💡 Consejos para una sesión segura y divertida:</div>
          <div>• En 4 segundos el video se expandirá automáticamente en vertical para enfocarse en el profesor.</div>
          <div>• Baila a tu propio ritmo. Si te cansas, puedes sentarte o descansar en cualquier momento.</div>
        </div>

        <button class="btn btn-vitalidad rumba-footer-btn-standard" style="width:100%;font-size:16px" onclick="closeRumbaterapiaModal()">
          ✓ Finalizar Baile y Volver
        </button>
      </div>
    `;

    document.body.appendChild(modal);
    speak("¡A disfrutar de la rumbaterapia! En 4 segundos se ajustará en vertical para ver mejor al profesor.");
  }

  function switchRumbaVideo(index) {
    currentRumbaIndex = index;
    const v = rumbaVideos[currentRumbaIndex];
    const titleEl = document.getElementById("rumba-modal-title");
    if (titleEl) titleEl.textContent = v.title;

    const btns = document.querySelectorAll(".rumba-opt-btn");
    btns.forEach((b, i) => b.classList.toggle("active", i === index % rumbaVideos.length));

    const container = document.getElementById("rumba-player-container");
    if (container) {
      container.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&start=${v.start || 0}&rel=0&modestbranding=1&playsinline=1" 
          title="${v.title}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;
    }
  }

  function closeRumbaterapiaModal() {
    if (rumbaZoomTimer) {
      clearTimeout(rumbaZoomTimer);
      rumbaZoomTimer = null;
    }
    isRumbaZoomed = false;

    const modal = document.getElementById("rumba-modal");
    if (modal) {
      const iframe = modal.querySelector("iframe");
      if (iframe) iframe.src = "";
      modal.remove();
    }
    if (wasMusicPlayingBeforeRumba && state.music) {
      resumeBackgroundMusic();
    }
  }

  // EXPORTAR AL ALCANCE GLOBAL
  window.go = go;
  window.routine = routine;
  window.startRoutine = startRoutine;
  window.startExercise = startExercise;
  window.tickExercise = tickExercise;
  window.pauseExercise = pauseExercise;
  window.resetExercise = resetExercise;
  window.stopPain = stopPain;
  window.editAppointment = editAppointment;
  window.saveAppointment = saveAppointment;
  window.editMedication = editMedication;
  window.saveMedication = saveMedication;
  window.openSheet = openSheet;
  window.closeSheet = closeSheet;
  window.logout = logout;
  window.loginNow = loginNow;
  window.setRoleTab = setRoleTab;
  window.newPatientModal = newPatientModal;
  window.saveNewPatient = saveNewPatient;
  window.newDoctorModal = newDoctorModal;
  window.saveNewDoc = saveNewDoc;
  window.openRegisterModal = openRegisterModal;
  window.registerUser = registerUser;
  window.startIntroTour = startIntroTour;
  window.nextIntroStep = nextIntroStep;
  window.prevIntroStep = prevIntroStep;
  window.nextMusicTrack = nextMusicTrack;
  window.openEditDoctorsModal = openEditDoctorsModal;
  window.savePatientDoctors = savePatientDoctors;
  window.openEditDiagnosisModal = openEditDiagnosisModal;
  window.saveDiagnosis = saveDiagnosis;
  window.openAboutModal = openAboutModal;
  window.rotateProfile = rotateProfile;
  window.pickRandomProfiles = pickRandomProfiles;
  window.toggleDemoMode = toggleDemoMode;
  window.DEMO_CONFIG = DEMO_CONFIG;
  window.openRumbaterapiaModal = openRumbaterapiaModal;
  window.closeRumbaterapiaModal = closeRumbaterapiaModal;
  window.switchRumbaVideo = switchRumbaVideo;
  window.activateRumbaVerticalZoom = activateRumbaVerticalZoom;
  window.toggleRumbaVerticalZoom = toggleRumbaVerticalZoom;

  render();
</script>
</body>
</html>
