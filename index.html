<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B2A5B">
  <meta name="description" content="Movify Senior: Plataforma de rehabilitación y bienestar físico adaptada para adultos mayores y profesionales de la salud.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/app_icon_simple_cyan.png">
  
  <!-- TIPOGRAFÍA OFICIAL DEL BRANDING: Montserrat (Títulos/Botones) e Inter (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <title>Movify Senior · Tu salud en movimiento</title>
  
  <style>
    /* PALETA DE COLOR OFICIAL EXTRAÍDA DEL KIT DE MARCA */
    :root {
      --azul-profundo: #1B2A5B;
      --verde-vitalidad: #008894;
      --verde-vitalidad-light: #e0f6f7;
      --azul-principal: #3882F6;
      --morado: #8B5CF6;
      --morado-soft: #ede7fb;
      --rosa: #F9A8D4;
      --rosa-palido: #FCE7F3;
      --azul-grisaceo: #64748B;
      
      --bg-light: #F8FAFC;
      --surface: #FFFFFF;
      --dark: #1B2A5B;
      --ink: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;

      --shadow-sm: 0 4px 12px rgba(27, 42, 91, 0.06);
      --shadow-md: 0 10px 25px rgba(27, 42, 91, 0.1);
      --shadow-lg: 0 20px 45px rgba(27, 42, 91, 0.16);

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;

      --font-title: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--ink);
      background: #F1F5F9;
      font-size: 16px;
      line-height: 1.5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:active {
      transform: scale(0.97);
    }

    .app-container {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 45%, #EFF6FF 100%);
      position: relative;
      overflow-x: hidden;
    }

    @media(min-width: 1000px) {
      .app-container {
        max-width: 1240px;
        box-shadow: 0 0 70px rgba(27, 42, 91, 0.14);
      }
    }

    .screen {
      min-height: 100vh;
      padding-bottom: 96px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TOPBAR CON IDENTIDAD VISUAL DEL KIT */
    .topbar {
      height: 78px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-brand img.logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .iconbtn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--azul-profundo);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
    }

    .iconbtn:hover {
      background: var(--verde-vitalidad-light);
      border-color: var(--verde-vitalidad);
    }

    .iconbtn.sos-btn {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #DC2626;
      font-weight: 800;
      font-size: 15px;
    }

    .content {
      padding: 22px 20px;
      max-width: 960px;
      margin: auto;
    }

    /* HERO CARD PACIENTE CON ILUSTRACIÓN */
    .hero {
      background: linear-gradient(135deg, var(--azul-profundo) 0%, #293B7A 60%, var(--verde-vitalidad) 100%);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 65%;
    }

    .hero-illustration {
      position: relative;
      z-index: 2;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-illustration img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }

    .eyebrow {
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--rosa-palido);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0 6px;
      line-height: 1.15;
    }

    .streak-badge {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* BOTONES ESTILO KIT DE MARCA */
    .btn {
      min-height: 52px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--morado) 0%, #7C3AED 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
      transform: translateY(-2px);
    }

    .btn-vitalidad {
      background: linear-gradient(135deg, var(--verde-vitalidad) 0%, #00707B 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(0, 136, 148, 0.35);
    }

    .btn-vitalidad:hover {
      transform: translateY(-2px);
    }

    .btn-soft {
      background: #FFFFFF;
      color: var(--azul-profundo);
      border: 1.5px solid var(--border);
    }

    .btn-soft:hover {
      background: var(--bg-light);
      border-color: var(--azul-principal);
    }

    .btn-danger {
      background: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    .btn-sm {
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 28px 0 14px;
    }

    .section-title h2 {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 800;
      color: var(--azul-profundo);
    }

    /* TARJETAS DE CATEGORÍAS CON ILUSTRACIONES DE ABUELITOS */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .cat-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--verde-vitalidad);
    }

    .cat-card-info b {
      font-family: var(--font-title);
      font-size: 17px;
      font-weight: 800;
      color: var(--azul-profundo);
      display: block;
      margin-bottom: 4px;
    }

    .cat-card-info span {
      font-size: 13px;
      color: var(--muted);
    }

    .cat-card-art {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-card-art img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* CARD GENÉRICA */
    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 99px;
      background: var(--verde-vitalidad-light);
      color: var(--verde-vitalidad);
      font-weight: 700;
      font-size: 12px;
      border: 1px solid rgba(0, 136, 148, 0.2);
    }

    .chip-purple {
      background: var(--morado-soft);
      color: var(--morado);
      border-color: rgba(139, 92, 246, 0.2);
    }

    /* LISTA DE EJERCICIOS */
    .exercise-list {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .exercise-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .exercise-card-art {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--verde-vitalidad-light);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .exercise-card-art img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .exercise-info h3 {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 700;
      color: var(--azul-profundo);
      margin-bottom: 2px;
    }

    .exercise-info p {
      color: var(--muted);
      font-size: 13px;
    }

    /* BARRA DE NAVEGACIÓN CON ICONOS OFICIALES DEL KIT */
    .bottomnav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1240px;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
      z-index: 50;
    }

    .navitem {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--azul-grisaceo);
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      padding: 4px;
      border-radius: 12px;
    }

    .navitem.active {
      color: var(--verde-vitalidad);
    }

    .navitem img.nav-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin-bottom: 2px;
      transition: transform 0.2s;
    }

    .navitem.active img.nav-icon {
      transform: scale(1.15);
      filter: drop-shadow(0 2px 5px rgba(0, 136, 148, 0.3));
    }

    /* PANTALLA LOGIN CON IMAGEN DE MARCA */
    .login-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .login-box {
      width: min(480px, 100%);
      background: #FFFFFF;
      border-radius: 32px;
      padding: 34px 26px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
    }

    .login-logo {
      width: 120px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #F1F5F9;
      padding: 5px;
      border-radius: 18px;
      margin: 20px 0 14px;
      gap: 4px;
    }

    .role-tab-btn {
      padding: 10px 4px;
      border-radius: 14px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 13px;
      color: var(--azul-grisaceo);
    }

    .role-tab-btn.active {
      background: var(--azul-profundo);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .demo-callout {
      background: var(--verde-vitalidad-light);
      color: var(--azul-profundo);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 18px;
      border: 1px dashed rgba(0, 136, 148, 0.35);
      text-align: left;
    }

    /* DASHBOARDS ADMIN Y DOCTOR */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--azul-profundo);
      color: #fff;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .sidebar-brand img {
      height: 38px;
    }

    .sidebtn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      color: #E2E8F0;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      text-align: left;
    }

    .sidebtn:hover, .sidebtn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .dashboard-main {
      padding: 28px 32px;
      background: #F8FAFC;
    }

    .stats-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .stat-box {
      background: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .stat-box b {
      font-family: var(--font-title);
      font-size: 30px;
      font-weight: 900;
      color: var(--azul-profundo);
      display: block;
      margin-top: 4px;
    }

    .data-table-container {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 22px;
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .data-table th {
      padding: 12px 14px;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 2px solid var(--border);
      font-family: var(--font-title);
    }

    .data-table td {
      padding: 14px;
      border-bottom: 1px solid #F1F5F9;
      vertical-align: middle;
    }

    .progress-bar {
      height: 10px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--verde-vitalidad), var(--azul-principal));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .toast-popup {
      position: fixed;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: var(--azul-profundo);
      color: white;
      padding: 12px 20px;
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      font-family: var(--font-title);
      font-weight: 700;
      display: none;
    }

    .toast-popup.show {
      display: block;
      animation: toastAnim 3s both;
    }

    @keyframes toastAnim {
      0%, 100% { opacity: 0; transform: translate(-50%, -10px); }
      15%, 85% { opacity: 1; transform: translate(-50%, 0); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .bottom-sheet {
      width: min(600px, 100%);
      background: #FFFFFF;
      border-radius: 30px 30px 0 0;
      padding: 26px 22px 34px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    /* ESTILOS DEL TOUR / INTRO */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .intro-card {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--verde-vitalidad);
    }

    .intro-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto 16px;
      display: block;
    }

    .intro-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }

    .intro-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #E2E8F0;
      transition: all 0.2s;
    }

    .intro-dot.active {
      width: 24px;
      border-radius: 99px;
      background: var(--verde-vitalidad);
    }

    /* REPRODUCTOR DE MÚSICA HUD */
    .music-hud {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .field { margin: 14px 0; }
    .field label {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
      color: var(--azul-profundo);
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--verde-vitalidad);
    }

    .doctor-multi-select {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .doctor-checkbox-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #F8FAFC;
      cursor: pointer;
    }

    .doctor-checkbox-card:hover {
      border-color: var(--verde-vitalidad);
    }

    .doctor-checkbox-card input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--verde-vitalidad);
    }

    .panel-title {
      color: var(--azul-profundo);
    }

    /* TEMA OSCURO - PANEL DEL SUPER ADMINISTRADOR (para diferenciarlo del resto de paneles) */
    .admin-dark {
      --muted: #94A3B8;
    }

    .admin-dark .sidebar {
      background: #0B1220;
    }

    .admin-dark .dashboard-main {
      background: #0F172A;
    }

    .admin-dark .panel-title {
      color: #F8FAFC;
    }

    .admin-dark .section-title h2 {
      color: #F1F5F9;
    }

    .admin-dark .stat-box {
      background: #1E293B;
      border-color: #334155;
      box-shadow: none;
      color: #F1F5F9;
    }

    .admin-dark .stat-box b {
      color: #F1F5F9;
    }

    .admin-dark .data-table-container {
      background: #1E293B;
      border-color: #334155;
    }

    .admin-dark .data-table th {
      border-bottom-color: #334155;
    }

    .admin-dark .data-table td {
      color: #E2E8F0;
      border-bottom-color: #293548;
    }

    .admin-dark .chip {
      background: rgba(0, 136, 148, 0.22);
      color: #5EEAD4;
    }

    .admin-dark .chip-purple {

  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBubbleSound() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const now = ctx.currentTime;
      const baseFreq = 420 + Math.random() * 90;
      osc.type = "sine";
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.08);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.09);
    } catch (e) {}
  }

  /* Helper para obtener nombres de médicos asignados al paciente */
  function getPatientDoctors(docIds) {
    if (!docIds || !docIds.length) return [state.doctors[0]];
    return docIds.map(id => state.doctors.find(d => d.id === id)).filter(Boolean);
  }

  /* Helper para mostrar las medallas del perfil como iconos en vez de un número */
  function renderMedals(count) {
    if (!count || count <= 0) {
      return `<div style="font-size:12px;color:var(--muted)">Aún sin medallas</div>`;
    }
    const shown = Math.min(count, 6);
    const icons = "🏅".repeat(shown);
    const extra = count > shown
      ? `<span style="font-size:12px;color:var(--azul-principal);font-weight:700;margin-left:2px">+${count - shown}</span>`
      : "";
    return `<div style="font-size:18px;line-height:1.3;letter-spacing:1px" title="${count} medallas">${icons}${extra}</div>`;
  }

  function savePatientDoctors(patientId) {
    const p = state.patients.find(x => x.id === patientId);
    if (!p) return;

    const selectedDocs = Array.from(document.querySelectorAll('input[name="assign_doc"]:checked')).map(cb => cb.value);
    if (!selectedDocs.length) return toast("Selecciona al menos un médico");

    p.doctorIds = selectedDocs;
    if (p.name === state.user.full) {
      state.user.doctorIds = selectedDocs;
    }

    closeSheet();
    save();
    render();
    toast(`Especialistas actualizados para ${p.name}`);
  }

              <div>
                <b style="font-family:var(--font-title);font-size:17px">Movify Clínico</b>
                <div style="font-size:11px;color:var(--rosa-palido)">${currentDoc.specialty}</div>
              </div>
            </div>

            <button class="sidebtn active">👥 Mis Pacientes (${myPatients.length})</button>
            <button class="sidebtn" onclick="openSheet(newPatientModal())">➕ Registrar Paciente</button>

            <div style="margin-top:auto">
              <button class="sidebtn" style="color:#FCA5A5" onclick="logout()">↪ Cerrar Sesión</button>
            </div>
          </aside>

          <main class="dashboard-main">
            <div class="row-flex">
              <div>
                <div class="eyebrow" style="color:var(--verde-vitalidad)">PORTAL MÉDICO DE SEGUIMIENTO</div>
                <h1 style="font-family:var(--font-title);font-size:26px;color:var(--azul-profundo);margin:2px 0">${currentDoc.name}</h1>
                <div style="font-size:13px;color:var(--muted)">${currentDoc.center}</div>
              </div>
              <button class="btn btn-soft btn-sm" onclick="logout()">Salir</button>
            </div>

            <div class="stats-grid-4">
              <div class="stat-box">
                <div style="font-size:13px;color:var(--muted);font-weight:700">Mis Pacientes</div>
                <b>${myPatients.length}</b>
              </div>
              <div class="stat-box">
                <div style="font-size:13px;color:var(--muted);font-weight:700">Adherencia Media</div>
                <b style="color:var(--verde-vitalidad)">86%</b>
              </div>
              <div class="stat-box">
                <div style="font-size:13px;color:var(--muted);font-weight:700">Rutinas Hoy</div>
                <b>${myPatients.length}</b>
              </div>
              <div class="stat-box">
                <div style="font-size:13px;color:var(--muted);font-weight:700">Alertas de Molestia</div>
                <b style="color:#B91C1C">0</b>
              </div>
            </div>

            <div class="section-title">
              <h2>Pacientes con Atención a mi Cargo (${myPatients.length})</h2>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));gap:16px">
              ${myPatients.map(p => {
                const team = getPatientDoctors(p.doctorIds);
                return `
                  <div class="card" style="margin-bottom:0">
                    <div class="row-flex" style="margin-bottom:12px">
                      <img src="${p.avatar}" alt="" style="width:48px;height:48px;border-radius:50%">
                      <span class="chip">${p.progress}% Adherencia</span>
                    </div>
                    <h3 style="font-family:var(--font-title);font-size:17px;color:var(--azul-profundo)">${p.name}</h3>
                    <p style="font-size:13px;color:var(--muted);margin-bottom:6px">${p.age} años · ${p.diagnosis}</p>
                    
                    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
                      <b>Equipo:</b> ${team.map(t => t.name.split(" ")[1]).join(", ")}
                    </div>

                    <div class="progress-bar" style="margin:8px 0">
                      <div class="progress-fill" style="width:${p.progress}%"></div>
                    </div>
                    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">🔥 Racha: ${p.streak} días · Último: ${p.lastRoutine}</div>
                    <button class="btn btn-vitalidad btn-sm" style="width:100%" onclick="toast('Prescripción abierta para '+${JSON.stringify(p.name)})">
                      Prescribir Ejercicios
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </main>
        </div>
      </section>
    `;
  }

  function emergency() {
    return `
      <section style="min-height:100vh;background:var(--azul-profundo);color:white;display:grid;place-items:center;text-align:center;padding:24px">
        <div>
          <div style="font-size:54px;margin-bottom:10px">🆘</div>
          <h1 style="font-family:var(--font-title);font-size:28px;margin-bottom:8px">Asistencia de Emergencia SOS</h1>
          <p style="opacity:.85;font-size:16px;max-width:400px;margin:0 auto 24px">
            Se notificará a <b>${state.user.emergency}</b> y a tu equipo médico asignado.
          </p>
          <button style="width:200px;height:200px;border-radius:50%;background:#EF4444;color:white;font-family:var(--font-title);font-size:24px;font-weight:900;border:8px solid rgba(255,255,255,0.2)" onclick="toast('Alerta enviada correctamente');speak('Se ha notificado a tu familiar y doctores.');setTimeout(()=>go('home'),1200)">
            SOLICITAR<br>AYUDA
          </button>
          <div style="margin-top:30px">
            <button class="btn btn-soft" onclick="go('home')">Cancelar</button>
          </div>
        </div>
      </section>
    `;
  }

  function app(html) { document.getElementById("app").innerHTML = html; }

  function render() {
    const r = state.role;
    const s = state.screen;
    if (!r || s === "login") return app(login());
    if (r === "admin" || s === "admin") return app(adminDashboard());
    if (r === "doctor" || s === "doctor") return app(doctorDashboard());
    if (s === "home") app(home());
    else if (s === "routines") app(routines());
    else if (s === "exercise") app(exerciseScreen());
    else if (s === "alerts") app(alerts());
    else if (s === "profile") app(profile());
    else if (s === "emergency") app(emergency());
    else app(home());
  }

  function routine(cat) {
    state.exercise = { category: cat, index: 0, reps: 0, paused: false };
    state.screen = "exercise";
    save();
    render();
    startBackgroundMusic();
    speak("Comencemos la rutina de " + cat);
  }

  function startRoutine() { routine("Calentamiento"); }

  function startExercise(cat, i) {
    state.exercise = { category: cat, index: i, reps: 0, paused: false };
    state.screen = "exercise";
    save();
    render();
    startBackgroundMusic();
    speak("Comenzamos: " + exercises[cat][i][0]);
  }

  function tickExercise() {
    if (state.exercise.paused) return toast("Ejercicio en pausa");
    const e = exercises[state.exercise.category][state.exercise.index];
    if (state.exercise.reps < e[1]) {
      state.exercise.reps++;
      vibratePhone(40);
      const left = e[1] - state.exercise.reps;
      if (left > 0) speak(`${left} restantes`);
      else speak("Ejercicio completado. ¡Muy bien!");
      save();
      render();
    } else {
      nextExercise();
    }
  }

  function nextExercise() {
    const cat = state.exercise.category;
    const next = state.exercise.index + 1;
    if (next < exercises[cat].length) {
      state.exercise.index = next;
      state.exercise.reps = 0;
      save();
      render();
      speak("Siguiente: " + exercises[cat][next][0]);
    } else {
      state.streak = Math.max(state.streak, 7);
      state.routinesDone++;
      state.medals++;
      stopBackgroundMusic();
      vibratePhone([60, 100, 60, 100, 120]);
      save();
      go("home");
      toast("¡Rutina completada con éxito!");
      speak(`¡Excelente sesión, ${state.user.name}! Has completado tu rutina diaria.`);
    }
  }

  function pauseExercise() {
    state.exercise.paused = !state.exercise.paused;
    if (state.exercise.paused) {
      pauseBackgroundMusic();
    } else {
      resumeBackgroundMusic();
    }
    save();
    render();
  }

  function resetExercise() {
    state.exercise.reps = 0;
    state.exercise.paused = false;
    startBackgroundMusic();
    save();
    render();
  }

  function stopPain() {
    stopBackgroundMusic();
    vibratePhone([100, 80, 100]);
    toast("Aviso de molestia registrado");
    speak("Has detenido el ejercicio. Descansa.");
    go("home");
  }

  function openSheet(html) {
    let m = document.createElement("div");
    m.id = "sheet-modal";
    m.className = "modal-overlay show";
    m.innerHTML = `<div class="bottom-sheet">${html}<button class="btn btn-soft" style="width:100%;margin-top:10px" onclick="closeSheet()">Cerrar</button></div>`;
    document.body.appendChild(m);
  }

  function closeSheet() {
    const m = document.getElementById("sheet-modal");
    if (m) m.remove();
  }

  function editAppointment(i = null) {
    const a = i === null ? { title: "", date: "", time: "", place: "", doctorName: "Dra. Sophia Mendoza" } : state.appointments[i];
    openSheet(`
      <h2 style="font-family:var(--font-title);font-size:20px;margin-bottom:10px">${i === null ? "Nueva Cita" : "Editar Cita"}</h2>
      <div class="field"><label>Motivo</label><input id="at" value="${a.title}"></div>
      <div class="field"><label>Fecha</label><input id="ad" value="${a.date}"></div>
      <div class="field"><label>Hora</label><input id="ah" value="${a.time}"></div>
      <div class="field"><label>Lugar</label><input id="al" value="${a.place}"></div>
      <div class="field">
        <label>Especialista</label>
        <select id="adoc">
          ${state.doctors.map(d => `<option value="${d.name}">${d.name} (${d.specialty})</option>`).join("")}
        </select>
      </div>
      <button class="btn btn-vitalidad" style="width:100%;margin-top:10px" onclick="saveAppointment(${i === null ? "null" : i})">Guardar</button>
    `);
  }

  function saveAppointment(i) {
    const item = { title: at.value, date: ad.value, time: ah.value, place: al.value, doctorName: adoc.value };
    if (i === null) state.appointments.push(item);
    else state.appointments[i] = item;
    closeSheet();
    save();
    render();
    toast("Cita guardada");
  }

  function editMedication(i = null) {
    const m = i === null ? { name: "", dose: "", time: "", note: "" } : state.medications[i];
    openSheet(`
      <h2 style="font-family:var(--font-title);font-size:20px;margin-bottom:10px">${i === null ? "Nuevo Fármaco" : "Editar"}</h2>
      <div class="field"><label>Nombre</label><input id="mn" value="${m.name}"></div>
      <div class="field"><label>Dosis</label><input id="md" value="${m.dose}"></div>
      <div class="field"><label>Horario</label><input id="mt" value="${m.time}"></div>
      <div class="field"><label>Nota</label><textarea id="mx">${m.note}</textarea></div>
      <button class="btn btn-vitalidad" style="width:100%;margin-top:10px" onclick="saveMedication(${i === null ? "null" : i})">Guardar</button>
    `);
  }

  function saveMedication(i) {
    const item = { name: mn.value, dose: md.value, time: mt.value, note: mx.value };
    if (i === null) state.medications.push(item);
    else state.medications[i] = item;
    closeSheet();
    save();
    render();
    toast("Medicación guardada");
  }

  function newPatientModal() {
    return `
      <h2 style="font-family:var(--font-title);font-size:20px;margin-bottom:12px">Registrar Paciente</h2>
      <div class="field"><label>Nombre Completo (ej. Rose Morales)</label><input id="np_name" placeholder="Rose Morales"></div>
      <div class="field"><label>Edad</label><input id="np_age" type="number" placeholder="73" value="73"></div>
      <div class="field"><label>Ciudad</label><input id="np_city" placeholder="Pelileo, Tungurahua" value="Pelileo, Tungurahua"></div>
      <div class="field"><label>Diagnóstico</label><input id="np_diag" placeholder="Artrosis de rodilla" value="Artrosis de rodilla"></div>
      
      <div class="field">
        <label>Especialistas Asignados (Varios permitidos)</label>
        <div class="doctor-multi-select">
          ${state.doctors.map(d => `
            <label class="doctor-checkbox-card">
              <input type="checkbox" name="np_docs" value="${d.id}" ${d.id === "doc1" ? "checked" : ""}>
              <div>
                <b>${d.name}</b>
                <div style="font-size:12px;color:var(--muted)">${d.specialty}</div>
              </div>
            </label>
          `).join("")}
        </div>
      </div>
      <button class="btn btn-vitalidad" style="width:100%;margin-top:12px" onclick="saveNewPatient()">Guardar Paciente</button>
    `;
  }

  function saveNewPatient() {
    const name = document.getElementById("np_name").value;
    if (!name) return toast("Ingresa el nombre");
    const selected = Array.from(document.querySelectorAll('input[name="np_docs"]:checked')).map(cb => cb.value);

    const newP = {
      id: "pat_" + Date.now(),
      name: name,
      email: `${name.toLowerCase().replace(/\s+/g, '')}@movify.ec`,
      age: Number(document.getElementById("np_age").value) || 70,
      city: document.getElementById("np_city").value || "Pelileo",
      diagnosis: document.getElementById("np_diag").value || "Rehabilitación",
      doctorIds: selected.length ? selected : ["doc1"],
      progress: 65,
      streak: 2,
      lastRoutine: "Hoy",
      emergency: "Familiar registrado",
      avatar: "assets/avatar_abuelita.png"
    };
    state.patients.unshift(newP);
    closeSheet();
    save();
    render();
    toast(`Paciente ${name} registrado con especialistas`);
  }

  function newDoctorModal() {
    return `
      <h2 style="font-family:var(--font-title);font-size:20px;margin-bottom:12px">Registrar Médico</h2>
      <div class="field"><label>Nombre (ej. Dr. William Silva)</label><input id="nd_name" placeholder="Dr. William Silva"></div>
      <div class="field"><label>Especialidad</label><input id="nd_spec" placeholder="Fisioterapeuta Geriátrico"></div>
      <div class="field"><label>Centro de Salud</label><input id="nd_center" placeholder="Hospital Pelileo"></div>
      <button class="btn btn-vitalidad" style="width:100%;margin-top:12px" onclick="saveNewDoc()">Guardar</button>
    `;
  }

  function saveNewDoc() {
    const name = document.getElementById("nd_name").value;
    if (!name) return toast("Ingresa el nombre");
    state.doctors.push({
      id: "doc_" + Date.now(),
      name: name,
      email: `${name.toLowerCase().replace(/\s+/g, '')}@movify.ec`,
      specialty: document.getElementById("nd_spec").value || "Rehabilitación",
      center: document.getElementById("nd_center").value || "Centro de Salud",
      phone: "+593 99 111 2233"
    });
    closeSheet();
    save();
    render();
    toast(`Doctor ${name} añadido`);
  }

  // EXPORTAR AL ALCANCE GLOBAL
  window.go = go;
  window.routine = routine;
  window.startRoutine = startRoutine;
  window.startExercise = startExercise;
  window.tickExercise = tickExercise;
  window.pauseExercise = pauseExercise;
  window.resetExercise = resetExercise;
  window.stopPain = stopPain;
  window.editAppointment = editAppointment;
  window.saveAppointment = saveAppointment;
  window.editMedication = editMedication;
  window.saveMedication = saveMedication;
  window.openSheet = openSheet;
  window.closeSheet = closeSheet;
  window.logout = logout;
  window.loginNow = loginNow;
  window.setRoleTab = setRoleTab;
  window.newPatientModal = newPatientModal;
  window.saveNewPatient = saveNewPatient;
  window.newDoctorModal = newDoctorModal;
  window.saveNewDoc = saveNewDoc;
  window.openRegisterModal = openRegisterModal;
  window.registerUser = registerUser;
  window.startIntroTour = startIntroTour;
  window.nextIntroStep = nextIntroStep;
  window.prevIntroStep = prevIntroStep;
  window.nextMusicTrack = nextMusicTrack;
  window.openEditDoctorsModal = openEditDoctorsModal;
  window.savePatientDoctors = savePatientDoctors;

  render();
</script>
</body>
</html>
